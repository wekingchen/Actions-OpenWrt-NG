name: Temporary V2 Live Smoke

on:
  push:
    branches:
      - "feat/v2-control-plane-productization"
    paths:
      - ".github/workflows/v2-productization-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: 线上 Worker 产品化冒烟
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONTROL_PLANE_URL: "https://openwrt-ng-control-plane.bad502.workers.dev"
    steps:
      - name: 检查 Health / Config / UI
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsS "$CONTROL_PLANE_URL/api/v1/health" -o /tmp/health.json
          curl -fsS "$CONTROL_PLANE_URL/api/v1/config" -o /tmp/config.json
          curl -fsS "$CONTROL_PLANE_URL/" -o /tmp/index.html
          curl -fsS "$CONTROL_PLANE_URL/app.js" -o /tmp/app.js

          jq -e '.ok == true and .runtime == "cloudflare-workers" and .configured == true' /tmp/health.json >/dev/null
          jq -e '.configured == true and (.githubAppInstallUrl | length > 0)' /tmp/config.json >/dev/null
          grep -q "OpenWrt NG · V2" /tmp/index.html
          grep -q "Profile 可读取" /tmp/app.js
          grep -q "仓库默认分支在编辑期间已经更新" /tmp/app.js

          echo "✅ 线上 Worker 产品化冒烟通过"
