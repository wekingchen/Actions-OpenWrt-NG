name: Deploy V2 Control Plane

on:
  workflow_dispatch:
    inputs:
      apply_github_app_secrets:
        description: "同步 GitHub App Secret（首次 bootstrap 部署不要勾选）"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openwrt-ng-control-plane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 Cloudflare Workers Control Plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_PLANE_D1_DATABASE_ID: ${{ vars.CONTROL_PLANE_D1_DATABASE_ID }}
      GITHUB_APP_CLIENT_ID: ${{ secrets.GITHUB_APP_CLIENT_ID }}
      GITHUB_APP_CLIENT_SECRET: ${{ secrets.GITHUB_APP_CLIENT_SECRET }}
      GITHUB_APP_SLUG: ${{ secrets.GITHUB_APP_SLUG }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: 检查 Cloudflare 配置
      run: |
        set -Eeuo pipefail

        for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTROL_PLANE_D1_DATABASE_ID; do
          if [ -z "${!name:-}" ]; then
            echo "ERROR: 缺少 $name" >&2
            exit 1
          fi
        done

        if ! printf '%s' "$CONTROL_PLANE_D1_DATABASE_ID" |
          grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}
          echo "ERROR: CONTROL_PLANE_D1_DATABASE_ID 格式无效" >&2
          exit 1
        fi

    - name: 安装 Wrangler
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm install --ignore-scripts --no-audit --no-fund

    - name: 生成部署配置
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        jq --arg database_id "$CONTROL_PLANE_D1_DATABASE_ID"           '.d1_databases[0].database_id = $database_id'           wrangler.jsonc > wrangler.deploy.jsonc

        jq -e           '.d1_databases[0].database_id != "00000000-0000-0000-0000-000000000000"'           wrangler.deploy.jsonc >/dev/null

    - name: 应用 D1 Migration
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler d1 migrations apply DB           --remote           --config wrangler.deploy.jsonc

    - name: 部署 Worker
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler deploy --config wrangler.deploy.jsonc

    - name: 同步 GitHub App Secret
      if: inputs.apply_github_app_secrets
      working-directory: control-plane
      run: |
        set -Eeuo pipefail

        for name in           GITHUB_APP_CLIENT_ID           GITHUB_APP_CLIENT_SECRET           GITHUB_APP_SLUG           TOKEN_ENCRYPTION_KEY
        do
          if [ -z "${!name:-}" ]; then
            echo "ERROR: 已要求同步 GitHub App Secret，但缺少 $name" >&2
            exit 1
          fi
        done

        jq -n           --arg client_id "$GITHUB_APP_CLIENT_ID"           --arg client_secret "$GITHUB_APP_CLIENT_SECRET"           --arg slug "$GITHUB_APP_SLUG"           --arg encryption_key "$TOKEN_ENCRYPTION_KEY"           '{
            GITHUB_APP_CLIENT_ID: $client_id,
            GITHUB_APP_CLIENT_SECRET: $client_secret,
            GITHUB_APP_SLUG: $slug,
            TOKEN_ENCRYPTION_KEY: $encryption_key
          }' > "$RUNNER_TEMP/control-plane-secrets.json"

        npx wrangler secret bulk           "$RUNNER_TEMP/control-plane-secrets.json"           --config wrangler.deploy.jsonc

        rm -f "$RUNNER_TEMP/control-plane-secrets.json"

    - name: 部署说明
      if: always()
      run: |
        {
          echo "## V2 Control Plane 部署"
          echo
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Cloudflare Worker / D1 部署步骤已完成。"
          else
            echo "❌ 部署失败，请查看上方步骤日志。"
          fi
          echo
          if [ "${{ inputs.apply_github_app_secrets }}" = "true" ]; then
            echo "- 本轮已请求同步 GitHub App Secret。"
          else
            echo "- 本轮为 bootstrap 模式，不要求 GitHub App Secret。"
            echo "- 先从 Worker 部署日志 / Cloudflare Dashboard 获取 workers.dev 地址，再创建 GitHub App。"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
; then
          echo "ERROR: CONTROL_PLANE_D1_DATABASE_ID 格式无效" >&2
          exit 1
        fi

    - name: 安装 Wrangler
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm install --ignore-scripts --no-audit --no-fund

    - name: 生成部署配置
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        jq --arg database_id "$CONTROL_PLANE_D1_DATABASE_ID"           '.d1_databases[0].database_id = $database_id'           wrangler.jsonc > wrangler.deploy.jsonc

        jq -e           '.d1_databases[0].database_id != "00000000-0000-0000-0000-000000000000"'           wrangler.deploy.jsonc >/dev/null

    - name: 应用 D1 Migration
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler d1 migrations apply DB           --remote           --config wrangler.deploy.jsonc

    - name: 部署 Worker
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler deploy --config wrangler.deploy.jsonc

    - name: 同步 GitHub App Secret
      if: inputs.apply_github_app_secrets
      working-directory: control-plane
      run: |
        set -Eeuo pipefail

        for name in           GITHUB_APP_CLIENT_ID           GITHUB_APP_CLIENT_SECRET           GITHUB_APP_SLUG           TOKEN_ENCRYPTION_KEY
        do
          if [ -z "${!name:-}" ]; then
            echo "ERROR: 已要求同步 GitHub App Secret，但缺少 $name" >&2
            exit 1
          fi
        done

        jq -n           --arg client_id "$GITHUB_APP_CLIENT_ID"           --arg client_secret "$GITHUB_APP_CLIENT_SECRET"           --arg slug "$GITHUB_APP_SLUG"           --arg encryption_key "$TOKEN_ENCRYPTION_KEY"           '{
            GITHUB_APP_CLIENT_ID: $client_id,
            GITHUB_APP_CLIENT_SECRET: $client_secret,
            GITHUB_APP_SLUG: $slug,
            TOKEN_ENCRYPTION_KEY: $encryption_key
          }' > "$RUNNER_TEMP/control-plane-secrets.json"

        npx wrangler secret bulk           "$RUNNER_TEMP/control-plane-secrets.json"           --config wrangler.deploy.jsonc

        rm -f "$RUNNER_TEMP/control-plane-secrets.json"

    - name: 部署说明
      if: always()
      run: |
        {
          echo "## V2 Control Plane 部署"
          echo
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Cloudflare Worker / D1 部署步骤已完成。"
          else
            echo "❌ 部署失败，请查看上方步骤日志。"
          fi
          echo
          if [ "${{ inputs.apply_github_app_secrets }}" = "true" ]; then
            echo "- 本轮已请求同步 GitHub App Secret。"
          else
            echo "- 本轮为 bootstrap 模式，不要求 GitHub App Secret。"
            echo "- 先从 Worker 部署日志 / Cloudflare Dashboard 获取 workers.dev 地址，再创建 GitHub App。"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
