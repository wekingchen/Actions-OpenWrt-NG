name: Deploy V2 Control Plane

on:
  workflow_dispatch:
    inputs:
      apply_github_app_secrets:
        description: "同步 GitHub App Secret（首次 bootstrap 不勾；已有 Secret 未变更时也无需勾）"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openwrt-ng-control-plane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 Cloudflare Workers Control Plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_PLANE_D1_DATABASE_ID: ${{ vars.CONTROL_PLANE_D1_DATABASE_ID }}
      GITHUB_APP_CLIENT_ID: ${{ secrets.OPENWRT_NG_GITHUB_APP_CLIENT_ID }}
      GITHUB_APP_CLIENT_SECRET: ${{ secrets.OPENWRT_NG_GITHUB_APP_CLIENT_SECRET }}
      GITHUB_APP_SLUG: ${{ secrets.OPENWRT_NG_GITHUB_APP_SLUG }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 共享代码同步门禁
      if: vars.OPENWRT_NG_SYNC_GATE_UPSTREAM != ''
      env:
        OPENWRT_NG_UPSTREAM_REPOSITORY: ${{ vars.OPENWRT_NG_SYNC_GATE_UPSTREAM }}
        OPENWRT_NG_UPSTREAM_REF: ${{ vars.OPENWRT_NG_SYNC_GATE_REF || 'main' }}
      run: |
        set -Eeuo pipefail
        python3 scripts/verify-shared-sync.py

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: 检查 Cloudflare 配置
      shell: bash
      run: |
        set -Eeuo pipefail

        for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTROL_PLANE_D1_DATABASE_ID; do
          if [ -z "${!name:-}" ]; then
            echo "ERROR: 缺少 $name" >&2
            exit 1
          fi
        done

        if [[ ! "$CONTROL_PLANE_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
          echo "ERROR: CONTROL_PLANE_D1_DATABASE_ID 格式无效" >&2
          exit 1
        fi

    - name: 检查 GitHub App Secret
      if: ${{ inputs.apply_github_app_secrets }}
      shell: bash
      run: |
        set -Eeuo pipefail

        for name in GITHUB_APP_CLIENT_ID GITHUB_APP_CLIENT_SECRET GITHUB_APP_SLUG TOKEN_ENCRYPTION_KEY; do
          if [ -z "${!name:-}" ]; then
            echo "ERROR: 已要求同步 GitHub App Secret，但缺少 $name" >&2
            exit 1
          fi
        done

        if [ "${#TOKEN_ENCRYPTION_KEY}" -lt 32 ]; then
          echo "ERROR: TOKEN_ENCRYPTION_KEY 至少需要 32 个字符" >&2
          exit 1
        fi

        if [[ ! "$GITHUB_APP_SLUG" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "ERROR: GITHUB_APP_SLUG 格式无效" >&2
          exit 1
        fi

        echo "GitHub App Secret 基础校验通过。"

    - name: 安装 Wrangler
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm ci --ignore-scripts --no-audit --no-fund

    - name: 生成部署配置
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        jq --arg database_id "$CONTROL_PLANE_D1_DATABASE_ID" '.d1_databases[0].database_id = $database_id' wrangler.jsonc > wrangler.deploy.jsonc
        jq -e '.d1_databases[0].database_id != "00000000-0000-0000-0000-000000000000"' wrangler.deploy.jsonc >/dev/null

    - name: 应用 D1 Migration
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

    - name: 部署 Worker
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler deploy --config wrangler.deploy.jsonc

    - name: 同步 GitHub App Secret
      if: ${{ inputs.apply_github_app_secrets }}
      working-directory: control-plane
      run: |
        set -Eeuo pipefail

        secret_file="$RUNNER_TEMP/control-plane-secrets.json"
        trap 'rm -f "$secret_file"' EXIT

        jq -n \
          --arg client_id "$GITHUB_APP_CLIENT_ID" \
          --arg client_secret "$GITHUB_APP_CLIENT_SECRET" \
          --arg slug "$GITHUB_APP_SLUG" \
          --arg encryption_key "$TOKEN_ENCRYPTION_KEY" \
          '{
            GITHUB_APP_CLIENT_ID: $client_id,
            GITHUB_APP_CLIENT_SECRET: $client_secret,
            GITHUB_APP_SLUG: $slug,
            TOKEN_ENCRYPTION_KEY: $encryption_key
          }' > "$secret_file"

        npx wrangler secret bulk "$secret_file" --config wrangler.deploy.jsonc

    - name: 部署说明
      if: always()
      run: |
        {
          echo "## V2 Control Plane 部署"
          echo
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Cloudflare Worker / D1 部署步骤已完成。"
          else
            echo "❌ 部署失败，请查看上方步骤日志。"
          fi
          echo
          if [ "${{ inputs.apply_github_app_secrets }}" = "true" ]; then
            echo "- 本轮已同步 GitHub App Secret。"
            echo "- GitHub App 推荐最终权限：Metadata read、Contents write、Pull requests write、Actions write。"
            echo "- 不需要 Administration / Workflows 权限。"
            echo "- 部署后请访问 /api/v1/health，确认 configured=true，再进行 GitHub 登录。"
          else
            echo "- 本轮未同步 GitHub App Secret；Worker 中已有 Secret 保持不变。"
            echo "- 如果这是首次 bootstrap 部署：先获取 workers.dev 地址，再创建 GitHub App，然后补齐四个 Secret 后重新运行并勾选同步。"
          fi
          echo
          echo "公共模板的 dashboard/data/control-plane.json 应继续保持 disabled；只有在自己的模板实例完成真实验证后再启用 Pages 入口。"
        } >> "$GITHUB_STEP_SUMMARY"
