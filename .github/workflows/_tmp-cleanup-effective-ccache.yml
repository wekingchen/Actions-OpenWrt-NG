name: Temporary cleanup effective ccache branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-cleanup-effective-ccache.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 删除已合并的有效 ccache 修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/enable-effective-ccache"
          status="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}'             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}")"
          if [ "${status}" = "204" ]; then
            echo "已删除 fix/enable-effective-ccache"
          elif [ "${status}" = "404" ] || [ "${status}" = "422" ]; then
            echo "分支已不存在"
          else
            cat /tmp/delete-ref.json >&2 || true
            exit 1
          fi
