name: Temporary dispatch Control Plane deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-dispatch-control-plane-deploy.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: 触发正式 Control Plane 部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body='{"ref":"main","inputs":{"apply_github_app_secrets":"false"}}'
          status="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             -d "$body"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-control-plane.yml/dispatches")"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch.json >&2 || true
            echo "触发部署失败，HTTP $status" >&2
            exit 1
          fi
          echo "已触发 Deploy V2 Control Plane"
