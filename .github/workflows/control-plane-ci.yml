name: V2 Control Plane CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node 24 Auth Broker 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: 静态检查
      run: |
        set -Eeuo pipefail
        node --check control-plane/server.mjs
        node --check control-plane/lib/security.mjs
        node --check control-plane/lib/store.mjs
        node --check control-plane/lib/github.mjs
        node --check control-plane/public/app.js
        node --check control-plane/test.mjs
        git diff --check

    - name: 运行服务端回归测试
      run: |
        set -Eeuo pipefail
        cd control-plane
        npm test

    - name: 构建容器镜像
      run: |
        set -Eeuo pipefail
        docker build -f control-plane/Dockerfile -t openwrt-ng-control-plane:test .
