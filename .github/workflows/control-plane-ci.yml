name: V2 Control Plane CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-control-plane.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-control-plane.yml"

permissions:
  contents: read

jobs:
  test:
    name: Workers / D1 / 自托管兼容测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: 安装 Wrangler
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm install --ignore-scripts --no-audit --no-fund

    - name: 静态检查
      run: |
        set -Eeuo pipefail
        node --check control-plane/worker.mjs
        node --check control-plane/worker.test.mjs
        node --check control-plane/server.mjs
        node --check control-plane/lib/security.mjs
        node --check control-plane/lib/d1-store.mjs
        node --check control-plane/lib/store.mjs
        node --check control-plane/lib/github.mjs
        node --check control-plane/public/app.js
        node --check control-plane/test.mjs
        python3 -m json.tool control-plane/wrangler.jsonc >/dev/null

        bad_github_secrets="$(
          grep -nE '\$\{\{[[:space:]]*secrets\.GITHUB_' .github/workflows/*.yml |
          grep -vE 'secrets\.GITHUB_TOKEN[[:space:]]*\}\}' || true
        )"
        if [ -n "$bad_github_secrets" ]; then
          printf '%s\n' "$bad_github_secrets"
          echo "ERROR: 自定义 GitHub Actions Secret 名称不能以 GITHUB_ 开头" >&2
          exit 1
        fi

        git diff --check

    - name: 运行控制面回归测试
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm test

    - name: 验证本地 D1 Migration
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler d1 migrations apply DB --local
        npx wrangler d1 execute DB --local --command "INSERT INTO oauth_states(state_hash,browser_hash,verifier_cipher,return_to,expires_at) VALUES('ci-state','ci-browser','ci-verifier','/',9999999999999); DELETE FROM oauth_states WHERE state_hash='ci-state' RETURNING state_hash;" >/tmp/d1-smoke.log
        grep -q "ci-state" /tmp/d1-smoke.log

    - name: 验证 Worker Bundle
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler deploy --dry-run --outdir .wrangler/dry-run

    - name: Worker 同源 UI / API 冒烟
      working-directory: control-plane
      run: |
        set -Eeuo pipefail

        cat > .dev.vars <<'EOF'
        GITHUB_APP_CLIENT_ID=Iv1.test
        GITHUB_APP_CLIENT_SECRET=test-client-secret
        GITHUB_APP_SLUG=openwrt-ng-test
        TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
        EOF

        npx wrangler dev --local --port 8788 >/tmp/wrangler-dev.log 2>&1 &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars' EXIT

        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8788/api/v1/health >/tmp/health.json 2>/dev/null; then
            break
          fi
          sleep 1
        done

        jq -e '.ok == true and .runtime == "cloudflare-workers" and .configured == true' /tmp/health.json >/dev/null
        curl -fsS http://127.0.0.1:8788/ | grep -q "OpenWrt NG Control Plane"
        curl -fsS http://127.0.0.1:8788/app.js | grep -q 'async function init'
        curl -fsS http://127.0.0.1:8788/style.css | grep -q '.shell'

    - name: 构建可选自托管容器
      run: |
        set -Eeuo pipefail
        docker build -f control-plane/Dockerfile -t openwrt-ng-control-plane:self-hosted-test .
