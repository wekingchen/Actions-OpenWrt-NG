name: V2 Control Plane CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-control-plane.yml"
      - ".github/workflows/build-openwrt.yml"
      - ".github/workflows/config-studio.yml"
      - ".github/workflows/release-existing.yml"
      - ".github/workflows/update-checker.yml"
      - ".github/workflows/pages-dashboard.yml"
      - ".github/workflows/profile-post-merge-cleanup.yml"
      - "scripts/**"
      - "adapters/**"
      - "profiles/**"
      - "dashboard/**"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-control-plane.yml"
      - ".github/workflows/build-openwrt.yml"
      - ".github/workflows/config-studio.yml"
      - ".github/workflows/release-existing.yml"
      - ".github/workflows/update-checker.yml"
      - ".github/workflows/pages-dashboard.yml"
      - ".github/workflows/profile-post-merge-cleanup.yml"
      - "scripts/**"
      - "adapters/**"
      - "profiles/**"
      - "dashboard/**"

permissions:
  contents: read

jobs:
  test:
    name: Workers / D1 / 自托管兼容测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 共享代码同步门禁
      env:
        OPENWRT_NG_UPSTREAM_REPOSITORY: ${{ vars.OPENWRT_NG_SYNC_GATE_UPSTREAM }}
        OPENWRT_NG_UPSTREAM_REF: ${{ vars.OPENWRT_NG_SYNC_GATE_REF }}
      run: |
        set -Eeuo pipefail
        python3 scripts/verify-shared-sync.py

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: 安装 Control Plane 依赖
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm ci --ignore-scripts --no-audit --no-fund

    - name: 静态检查
      run: |
        set -Eeuo pipefail
        node --check control-plane/worker.mjs
        node --check control-plane/worker.test.mjs
        node --check control-plane/server.mjs
        node --check control-plane/lib/security.mjs
        node --check control-plane/lib/d1-store.mjs
        node --check control-plane/lib/store.mjs
        node --check control-plane/lib/github.mjs
        node --check control-plane/lib/profile-template.mjs
        node --check control-plane/public/app.js
        node --check control-plane/test.mjs
        node --check control-plane/server-routes.test.mjs
        node --check control-plane/contract.test.mjs
        node --check control-plane/github-profile-restore.test.mjs
        node --check control-plane/github-profile-merge-policy.test.mjs
        python3 -m py_compile scripts/verify-runtime-api.py
        OPENWRT_NG_EXPECTED_RUNTIME_API=2 python3 scripts/verify-runtime-api.py
        python3 -m py_compile scripts/verify-shared-sync.py
        python3 scripts/test-verify-shared-sync.py
        python3 -m py_compile scripts/config-studio.py
        python3 scripts/test-config-studio.py
        python3 scripts/test_detect_failed_target.py
        python3 -m py_compile scripts/extract_failure_context.py
        python3 scripts/test_extract_failure_context.py
        python3 -m py_compile scripts/profile-post-merge-cleanup.py
        python3 scripts/test-profile-post-merge-cleanup.py
        bash -n scripts/compile.sh
        bash -n scripts/apply-extra-feeds.sh
        python3 -m py_compile scripts/merge-feeds.py
        python3 scripts/test-merge-feeds.py
        bash -n scripts/install-feeds.sh
        python3 -m py_compile scripts/resolve-feed-priority.py
        python3 scripts/test-resolve-feed-priority.py
        grep -q 'FEED_PRIORITY_MODE' scripts/profile.sh
        grep -q -- '--mode "$priority_mode"' scripts/install-feeds.sh
        grep -q 'feed-priority.json' scripts/archive-config.sh
        bash -n scripts/cleanup-workflow-runs.sh
        python3 -m py_compile scripts/cleanup-actions-caches.py
        python3 scripts/test-cleanup-actions-caches.py
        bash -n scripts/write-summary.sh
        bash -n scripts/profile.sh
        grep -q 'OPENWRT_NG_GIT_TIMEOUT' scripts/resolve-update-state.sh
        grep -q 'timeout --signal=TERM' scripts/resolve-update-state.sh
        grep -q 'timeout=30' scripts/dashboard/export-data.py
        grep -q 'readJsonBody(request, limit = 5 \* 1024 \* 1024)' control-plane/worker.mjs
        ! grep -q 'await request.json()' control-plane/worker.mjs
        grep -q "if: github.event_name != 'pull_request'" .github/workflows/pages-dashboard.yml
        grep -q "if: github.event_name == 'pull_request'" .github/workflows/pages-dashboard.yml

        mapfile -t all_shell_files < <(
          find scripts adapters profiles -type f -name '*.sh' -print | sort
        )
        for file in "${all_shell_files[@]}"; do
          bash -n "$file"
        done

        mapfile -t all_python_files < <(
          find scripts -type f -name '*.py' -print | sort
        )
        if [ "${#all_python_files[@]}" -gt 0 ]; then
          python3 -m py_compile "${all_python_files[@]}"
        fi

        mapfile -t dashboard_js_files < <(
          find dashboard/assets -type f -name '*.js' -print | sort
        )
        for file in "${dashboard_js_files[@]}"; do
          node --check "$file"
        done

        node scripts/dashboard/test-control-plane.mjs
        bash scripts/dashboard/test-wizard.sh

        test "$(scripts/profile.sh resolve)" = "$(tr -d '\r\n[:space:]' < profiles/.baseline)"
        grep -q 'resolve_baseline_profile' scripts/profile.sh
        grep -q 'profiles/.baseline' control-plane/lib/github.mjs
        grep -q 'setBaselineProfilePullRequest' control-plane/lib/github.mjs
        grep -q 'profileBaselineMatch' control-plane/worker.mjs
        grep -q 'profileBaselineMatch' control-plane/server.mjs
        grep -q 'id="baseline-profile-dialog"' control-plane/public/index.html
        grep -q 'openBaselineProfileDialog' control-plane/public/app.js
        grep -q 'copyProfilePullRequest' control-plane/lib/github.mjs
        grep -q 'renameProfilePullRequest' control-plane/lib/github.mjs
        grep -q 'cleanupConfigStudioSessionsForProfile' control-plane/lib/github.mjs
        grep -q 'cancelBuilderRun' control-plane/lib/github.mjs
        grep -q 'rerunBuilderRun' control-plane/lib/github.mjs
        grep -q 'profileLifecycleMatch' control-plane/worker.mjs
        grep -q 'profileLifecycleMatch' control-plane/server.mjs
        grep -q 'buildControlMatch' control-plane/worker.mjs
        grep -q 'buildControlMatch' control-plane/server.mjs
        grep -q 'id="profile-lifecycle-dialog"' control-plane/public/index.html
        grep -q 'openProfileLifecycleDialog' control-plane/public/app.js
        grep -q 'controlBuilderRun' control-plane/public/app.js
        grep -q 'listDeletedProfiles' control-plane/lib/github.mjs
        grep -q 'restoreDeletedProfilePullRequest' control-plane/lib/github.mjs
        grep -q 'triggerReleaseExisting' control-plane/lib/github.mjs
        grep -q 'getReleaseExistingRun' control-plane/lib/github.mjs
        grep -q 'triggerUpdateChecker' control-plane/lib/github.mjs
        grep -q 'getUpdateCheckerRun' control-plane/lib/github.mjs
        grep -q 'deletedProfilesMatch' control-plane/worker.mjs
        grep -q 'profileRestoreMatch' control-plane/worker.mjs
        grep -q 'releaseExistingTriggerMatch' control-plane/worker.mjs
        grep -q 'updateCheckerMatch' control-plane/worker.mjs
        grep -q 'deletedProfilesMatch' control-plane/server.mjs
        grep -q 'profileRestoreMatch' control-plane/server.mjs
        grep -q 'releaseExistingTriggerMatch' control-plane/server.mjs
        grep -q 'updateCheckerMatch' control-plane/server.mjs
        grep -q 'id="update-checker-dialog"' control-plane/public/index.html
        grep -q 'id="release-existing-dialog"' control-plane/public/index.html
        grep -q 'id="deleted-profiles-section"' control-plane/public/index.html
        grep -q 'openUpdateCheckerDialog' control-plane/public/app.js
        grep -q 'openReleaseExistingDialog' control-plane/public/app.js
        grep -q 'loadDeletedProfiles' control-plane/public/app.js
        grep -q 'restoreDeletedProfile' control-plane/public/app.js
        python3 -m json.tool control-plane/wrangler.jsonc >/dev/null
        python3 -m json.tool control-plane/api-schema.json >/dev/null
        test -f control-plane/package-lock.json
        grep -q '"lockfileVersion": 3' control-plane/package-lock.json
        grep -q 'npm ci --omit=dev' control-plane/Dockerfile

        grep -q 'control_plane_request_id:' .github/workflows/build-openwrt.yml
        grep -q 'cp:{0}' .github/workflows/build-openwrt.yml
        grep -q 'openwrt/.ccache' .github/workflows/build-openwrt.yml
        grep -q 'CONFIG_DEVEL=y' profiles/default/.config
        grep -q 'CONFIG_CCACHE=y' profiles/default/.config
        grep -q 'ccache 配置验收通过' .github/workflows/build-openwrt.yml
        grep -q 'Profile 请求 CONFIG_CCACHE=y' .github/workflows/build-openwrt.yml
        grep -q 'openwrt-ng-build-v3-ubuntu24-' .github/workflows/build-openwrt.yml
        ! grep -q 'openwrt-ng-build-v2-' .github/workflows/build-openwrt.yml
        grep -q 'CCACHE_MAXSIZE: 2G' .github/workflows/build-openwrt.yml
        test "$(grep -c 'runs-on: ubuntu-24.04' .github/workflows/build-openwrt.yml)" -eq 4
        ! grep -q 'runs-on: ubuntu-22.04' .github/workflows/build-openwrt.yml
        awk '
          /name: 编译 OpenWrt 固件/ { in_build=1 }
          in_build && /timeout-minutes:/ {
            if ($2 != 360) exit 1
            found=1
            exit 0
          }
          END { if (!found) exit 1 }
        ' .github/workflows/build-openwrt.yml
        grep -q 'detect_failed_target.py' scripts/compile.sh
        grep -q 'extract_failure_context.py' scripts/compile.sh
        grep -q 'OPENWRT_NG_DEBUG_STREAM_LOG' scripts/compile.sh
        ! grep -q 'STREAM_BUILD_LOG.*tee' scripts/compile.sh
        grep -q 'build-error-context.log' .github/workflows/build-openwrt.yml
        ! grep -q '^[[:space:]]*build[.]log$' .github/workflows/build-openwrt.yml
        test -f scripts/detect_failed_target.py
        test -f scripts/test_detect_failed_target.py
        test -f scripts/extract_failure_context.py
        test -f scripts/test_extract_failure_context.py
        grep -q 'CCACHE_DIR="$PWD/.ccache"' scripts/compile.sh
        grep -q 'ccache 本轮 Hits' scripts/write-summary.sh
        grep -q 'write_ccache_stats' scripts/compile.sh
        grep -q '^unset FILES_DIR$' scripts/compile.sh
        grep -q 'PROFILE_FILES_DIR' scripts/profile.sh
        ! grep -q 'emit_env FILES_DIR' scripts/profile.sh
        tmp_env="$(mktemp)"
        GITHUB_ENV="$tmp_env" scripts/profile.sh export default >/dev/null
        grep -q '^PROFILE_FILES_DIR=' "$tmp_env"
        grep -q '^EXTRA_FEEDS_FILE=' "$tmp_env"
        ! grep -q '^FILES_DIR=' "$tmp_env"
        rm -f "$tmp_env"

        tmp_root="$(mktemp -d)"
        printf 'src-git demo https://github.com/example/demo.git;main\n' > "$tmp_root/extra-feeds.conf"
        printf 'src-git packages https://github.com/openwrt/packages.git;master\n' > "$tmp_root/feeds.conf.default"
        bash scripts/apply-extra-feeds.sh "$tmp_root" "$tmp_root/extra-feeds.conf" >/dev/null
        head -n1 "$tmp_root/feeds.conf.default" | grep -q '^src-git demo '
        rm -rf "$tmp_root"
        grep -q "steps.compile.outcome == 'failure'" .github/workflows/build-openwrt.yml
        grep -q 'actions/cache/save@v6' .github/workflows/build-openwrt.yml
        test "$(grep -c 'overwrite: true' .github/workflows/build-openwrt.yml)" -eq 6
        grep -q '^run-name: Release Existing · source:' .github/workflows/release-existing.yml
        grep -q 'source_workflow_path' .github/workflows/release-existing.yml
        grep -Fq '.github/workflows/build-openwrt.yml' .github/workflows/release-existing.yml
        ! grep -q 'runs-on: ubuntu-22.04' .github/workflows/release-existing.yml
        grep -q '^run-name: Update Checker · profile:' .github/workflows/update-checker.yml
        grep -q 'force:' .github/workflows/update-checker.yml
        ! grep -q 'runs-on: ubuntu-22.04' .github/workflows/update-checker.yml
        test "$(grep -c 'runs-on: ubuntu-24.04' .github/workflows/update-checker.yml)" -eq 2
        grep -q 'Resource not accessible by integration' .github/workflows/build-openwrt.yml
        grep -q 'default-branch-fallback' .github/workflows/build-openwrt.yml
        grep -q 'target_mode=' .github/workflows/build-openwrt.yml
        grep -Fq 'group: openwrt-ng-${{ needs.preflight.outputs.profile }}' .github/workflows/build-openwrt.yml
        ! grep -Fq "github.event.inputs.profile || github.event.client_payload.profile || 'baseline'" .github/workflows/build-openwrt.yml
        grep -Fq 'group: openwrt-ng-release-existing-${{ inputs.run_id }}' .github/workflows/release-existing.yml
        grep -q '^  group: openwrt-ng-pages-' .github/workflows/pages-dashboard.yml
        grep -q "github.event_name == 'pull_request'" .github/workflows/pages-dashboard.yml
        grep -q 'Tag Target 模式' .github/workflows/build-openwrt.yml
        grep -q 'scripts/cleanup-workflow-runs.sh' .github/workflows/build-openwrt.yml
        grep -q 'contents/.github/workflows?ref=' scripts/cleanup-workflow-runs.sh
        grep -q 'actions/runs?per_page=100' scripts/cleanup-workflow-runs.sh
        grep -q '已无对应 yml/yaml' scripts/cleanup-workflow-runs.sh
        grep -q 'return_run_details: true' control-plane/lib/github.mjs
        grep -q 'CONFIG_STUDIO_WORKFLOW = "config-studio.yml"' control-plane/lib/github.mjs
        grep -q 'startConfigStudio' control-plane/lib/github.mjs
        grep -q 'submitConfigStudioSelection' control-plane/lib/github.mjs
        grep -q 'applyConfigStudioToProfile' control-plane/lib/github.mjs
        grep -q 'configStudioRootMatch' control-plane/worker.mjs
        grep -q 'configStudioRootMatch' control-plane/server.mjs
        grep -q 'make defconfig' .github/workflows/config-studio.yml
        grep -q 'permissions:' .github/workflows/config-studio.yml
        grep -q 'contents: read' .github/workflows/config-studio.yml
        ! grep -q 'contents: write' .github/workflows/config-studio.yml
        grep -q 'actions/upload-artifact@v7' .github/workflows/config-studio.yml
        ! grep -q 'actions/download-artifact' .github/workflows/config-studio.yml
        grep -q 'apiBytes' control-plane/lib/github.mjs
        grep -q 'unzipSync' control-plane/lib/github.mjs
        grep -q 'config-studio-kconfig.c' scripts/config-studio.py
        ! grep -q 'kconfiglib' .github/workflows/config-studio.yml
        grep -q 'unset FILES_DIR' .github/workflows/config-studio.yml
        grep -q 'apply-extra-feeds.sh' .github/workflows/config-studio.yml
        grep -q 'extraFeeds // ""' .github/workflows/config-studio.yml
        grep -q 'config-studio-request.json' .github/workflows/config-studio.yml
        grep -Fq 'ref: ${{ inputs.session_branch }}' .github/workflows/config-studio.yml
        grep -q 'name: 运行 Profile Preflight' .github/workflows/config-studio.yml
        grep -q 'OPENWRT_NG_PREFLIGHT_ENV=' .github/workflows/config-studio.yml
        grep -q 'PROFILE_FILES_DIR' .github/workflows/config-studio.yml
        grep -q 'profileSnapshot: Boolean(profileSnapshot)' control-plane/lib/github.mjs
        grep -q 'profileFiles: Object.fromEntries' control-plane/public/app.js
        grep -q 'apply-extra-feeds.sh' .github/workflows/build-openwrt.yml
        grep -q 'merge-feeds.py' scripts/apply-extra-feeds.sh
        ! grep -q '同步主仓运行时脚本' .github/workflows/config-studio.yml
        ! grep -q '同步主仓运行时脚本' .github/workflows/build-openwrt.yml
        ! grep -q 'rm -rf scripts adapters' .github/workflows/*.yml
        if grep -rnE 'wekingchen[/]' .github scripts adapters control-plane/*.mjs control-plane/lib; then
          echo "ERROR: 通用主干不得硬编码维护者个人仓库名" >&2
          exit 1
        fi
        grep -q 'install-feeds.sh' .github/workflows/config-studio.yml
        grep -q 'install-feeds.sh' .github/workflows/build-openwrt.yml
        grep -q 'resolve-feed-priority.py' scripts/install-feeds.sh
        grep -q -- '--force passwall_packages' control-plane/public/app.js
        grep -q -- '--force passwall_luci' control-plane/public/app.js
        grep -q 'id="new-feed-fw876"' control-plane/public/index.html
        grep -q 'id="new-feed-sbwml"' control-plane/public/index.html
        grep -q -- '--force helloworld https://github.com/fw876/helloworld.git' control-plane/public/app.js
        grep -q -- '--force sbwml_helloworld https://github.com/sbwml/openwrt_helloworld.git;v5' control-plane/public/app.js
        grep -q 'EXTRA_FEEDS_FILE' scripts/profile.sh
        grep -q 'id="new-extra-feeds"' control-plane/public/index.html
        grep -q 'id="new-feed-passwall"' control-plane/public/index.html
        grep -q '继续图形配置' control-plane/public/app.js
        grep -q 'id="config-studio-dialog"' control-plane/public/index.html
        grep -q 'name: 准备 OpenWrt 源码' .github/workflows/config-studio.yml
        grep -q 'name: 更新 Feeds' .github/workflows/config-studio.yml
        grep -q 'name: 安装 Feeds' .github/workflows/config-studio.yml
        grep -q 'configStudioProgressFromJobs' control-plane/lib/github.mjs
        grep -q 'builderProgressFromJobs' control-plane/lib/github.mjs
        grep -q 'id="config-studio-progress-bar"' control-plane/public/index.html
        grep -q 'id="recent-build-progress"' control-plane/public/index.html
        grep -q 'id="build-detail-progress"' control-plane/public/index.html
        grep -q 'renderConfigStudioProgress' control-plane/public/app.js
        grep -q 'renderActionProgressCard' control-plane/public/app.js
        grep -q '真实步骤进度会自动刷新' control-plane/public/app.js
        grep -q 'function renderConfigStudioPackages' control-plane/public/app.js
        grep -q 'friendlyError' control-plane/public/app.js
        grep -q 'Profile 可读取' control-plane/public/app.js
        grep -q 'role="alert"' control-plane/public/index.html
        grep -q 'TOKEN_ENCRYPTION_KEY 至少需要 32 个字符' .github/workflows/deploy-control-plane.yml
        grep -q 'Administration / Workflows' .github/workflows/deploy-control-plane.yml
        grep -q 'buildProfileTemplateFiles' control-plane/worker.mjs
        grep -q 'profile_already_exists' control-plane/lib/github.mjs
        grep -q 'PROFILE_MERGE_POLICY' control-plane/worker.mjs
        grep -q 'PROFILE_MERGE_POLICY' control-plane/server.mjs
        grep -q '"PROFILE_MERGE_POLICY": "immediate"' control-plane/wrangler.jsonc
        grep -q 'enablePullRequestAutoMerge' control-plane/lib/github.mjs
        grep -q 'unexpectedPath' control-plane/test.mjs

        bad_github_secrets="$(
          grep -nE '\$\{\{[[:space:]]*secrets\.GITHUB_' .github/workflows/*.yml |
          grep -vE 'secrets\.GITHUB_TOKEN[[:space:]]*\}\}' || true
        )"
        if [ -n "$bad_github_secrets" ]; then
          printf '%s\n' "$bad_github_secrets"
          echo "ERROR: 自定义 GitHub Actions Secret 名称不能以 GITHUB_ 开头" >&2
          exit 1
        fi

        if grep -qE 'openwrt/staging_dir/(host|target-\*)/ccache|~/.ccache' .github/workflows/build-openwrt.yml; then
          echo "ERROR: Lean/OpenWrt CONFIG_CCACHE 默认使用 openwrt/.ccache，不能恢复旧错误路径" >&2
          exit 1
        fi

        git diff --check

    - name: 运行控制面回归测试
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npm test

    - name: 验证本地 D1 Migration
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler d1 migrations apply DB --local
        npx wrangler d1 execute DB --local --command "INSERT INTO oauth_states(state_hash,browser_hash,verifier_cipher,return_to,expires_at) VALUES('ci-state','ci-browser','ci-verifier','/',9999999999999); DELETE FROM oauth_states WHERE state_hash='ci-state' RETURNING state_hash;" >/tmp/d1-smoke.log
        grep -q "ci-state" /tmp/d1-smoke.log

    - name: 验证 Worker Bundle
      working-directory: control-plane
      run: |
        set -Eeuo pipefail
        npx wrangler deploy --dry-run --outdir .wrangler/dry-run

    - name: Worker 同源 UI / API 冒烟
      working-directory: control-plane
      run: |
        set -Eeuo pipefail

        cat > .dev.vars <<'EOF'
        GITHUB_APP_CLIENT_ID=Iv1.test
        GITHUB_APP_CLIENT_SECRET=test-client-secret
        GITHUB_APP_SLUG=openwrt-ng-test
        TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
        EOF

        npx wrangler dev --local --port 8788 >/tmp/wrangler-dev.log 2>&1 &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars' EXIT

        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8788/api/v1/health >/tmp/health.json 2>/dev/null; then
            break
          fi
          sleep 1
        done

        jq -e '.ok == true and .runtime == "cloudflare-workers" and .configured == true' /tmp/health.json >/dev/null
        curl -fsS http://127.0.0.1:8788/ -o /tmp/control-plane-index.html
        curl -fsS http://127.0.0.1:8788/app.js -o /tmp/control-plane-app.js
        curl -fsS http://127.0.0.1:8788/style.css -o /tmp/control-plane-style.css

        grep -q "OpenWrt NG Control Plane" /tmp/control-plane-index.html
        grep -q 'class="app-shell"' /tmp/control-plane-index.html
        grep -q 'class="sidebar"' /tmp/control-plane-index.html
        grep -q 'id="repo-switcher"' /tmp/control-plane-index.html
        grep -q 'id="repo-meta-line"' /tmp/control-plane-index.html
        grep -q 'id="account-menu"' /tmp/control-plane-index.html
        grep -q 'id="workspace-empty"' /tmp/control-plane-index.html
        grep -q 'id="create-pr"' /tmp/control-plane-index.html
        grep -q 'id="new-profile-open"' /tmp/control-plane-index.html
        grep -q 'id="new-profile-form"' /tmp/control-plane-index.html
        grep -q 'id="new-profile-preview"' /tmp/control-plane-index.html
        grep -q 'id="trigger-build"' /tmp/control-plane-index.html
        grep -q 'id="build-runs"' /tmp/control-plane-index.html
        grep -q 'async function init' /tmp/control-plane-app.js
        grep -q 'preview-change' /tmp/control-plane-app.js
        grep -q 'loadBuildRuns' /tmp/control-plane-app.js
        grep -q 'openBuildDialog' /tmp/control-plane-app.js
        grep -q 'parseProfileReleasePolicy' /tmp/control-plane-app.js
        grep -q 'renderBuildRows' /tmp/control-plane-app.js
        grep -q 'builds?limit=100' /tmp/control-plane-app.js
        grep -q 'Math.min(100' lib/github.mjs
        grep -q 'getBuilderArtifactDownloadUrl' lib/github.mjs
        grep -q 'getBuilderArtifactDownloadUrl' worker.mjs
        grep -q 'getBuilderArtifactDownloadUrl' server.mjs
        grep -q '/artifacts/' /tmp/control-plane-app.js
        grep -q '/download' /tmp/control-plane-app.js
        grep -q 'selectionVersion' /tmp/control-plane-app.js
        grep -q 'buildState.generation' /tmp/control-plane-app.js
        grep -q 'buildDialogState.requestVersion' /tmp/control-plane-app.js
        grep -q 'result.requestId' /tmp/control-plane-app.js
        grep -q 'build_already_active' /tmp/control-plane-app.js
        grep -q 'profile-copy-action' /tmp/control-plane-app.js
        grep -q 'profile-rename-action' /tmp/control-plane-app.js
        grep -q 'controlBuilderRun' /tmp/control-plane-app.js
        grep -q 'readNewProfileInput' /tmp/control-plane-app.js
        grep -q '/api/v1/profile-templates/preview' /tmp/control-plane-app.js
        grep -q 'profile_already_exists' /tmp/control-plane-app.js
        grep -q 'updateRepositoryContext' /tmp/control-plane-app.js
        grep -q 'data.repositories.length === 1' /tmp/control-plane-app.js
        grep -q 'profile-build-action' /tmp/control-plane-app.js
        grep -q 'function navigateControlPlane' /tmp/control-plane-app.js
        grep -q 'function showControlPlaneView' /tmp/control-plane-app.js
        grep -q 'function setActiveNavigation' /tmp/control-plane-app.js
        grep -q 'data-nav="workspace"' /tmp/control-plane-index.html
        grep -q 'data-nav="profiles"' /tmp/control-plane-index.html
        grep -q 'data-nav="builder"' /tmp/control-plane-index.html
        grep -q 'aria-controls="profile-card"' /tmp/control-plane-index.html
        grep -q 'aria-controls="build-card"' /tmp/control-plane-index.html
        grep -q 'id="build-dialog"' /tmp/control-plane-index.html
        grep -q 'id="baseline-profile-dialog"' /tmp/control-plane-index.html
        grep -q 'id="profile-lifecycle-dialog"' /tmp/control-plane-index.html
        grep -q 'id="recent-build-runs"' /tmp/control-plane-index.html
        grep -q 'id="publish-release-help"' /tmp/control-plane-index.html
        grep -q 'account-dropdown' /tmp/control-plane-app.js
        grep -q '.app-shell' /tmp/control-plane-style.css
        grep -q '.content-grid' /tmp/control-plane-style.css
        grep -q '.profile-build-action' /tmp/control-plane-style.css
        grep -q '.build-dialog-backdrop' /tmp/control-plane-style.css
        grep -q '.build-record' /tmp/control-plane-style.css
        grep -q 'display: grid !important' /tmp/control-plane-style.css
        if grep -q 'class="hero"' /tmp/control-plane-index.html; then
          echo "ERROR: 登录后工作台不应重新引入营销 Hero" >&2
          exit 1
        fi
        if grep -q 'id="metric-repo-count"' /tmp/control-plane-index.html; then
          echo "ERROR: 仓库数量统计不应重复占用首屏" >&2
          exit 1
        fi
        if grep -q 'id="repo-card"' /tmp/control-plane-index.html; then
          echo "ERROR: 顶栏仓库切换器启用后不应再保留当前仓库卡" >&2
          exit 1
        fi
        if grep -q 'class="summary-grid"' /tmp/control-plane-index.html; then
          echo "ERROR: 工作台不应重新引入重复统计卡" >&2
          exit 1
        fi
        if grep -q '>Profiles</span>' /tmp/control-plane-index.html || grep -q '>Builder</span>' /tmp/control-plane-index.html; then
          echo "ERROR: 底部 / 侧栏导航应保持中文标签" >&2
          exit 1
        fi
        if grep -q 'href="#profile-card"' /tmp/control-plane-index.html || \
           grep -q 'href="#editor-card"' /tmp/control-plane-index.html || \
           grep -q 'href="#build-card"' /tmp/control-plane-index.html; then
          echo "ERROR: 工作台导航不能退化为页内锚点" >&2
          exit 1
        fi
        if ! grep -q '<button class="nav-item active" type="button" data-nav="workspace"' /tmp/control-plane-index.html; then
          echo "ERROR: 工作区导航必须使用真实操作按钮" >&2
          exit 1
        fi
        if grep -q 'buildState.profileId' /tmp/control-plane-app.js || \
           grep -q 'setupBuildControl' /tmp/control-plane-app.js || \
           grep -q 'updateBuildOverview' /tmp/control-plane-app.js; then
          echo "ERROR: 构建历史不应依赖隐式当前 Profile 状态" >&2
          exit 1
        fi
        if grep -q 'id="actions-permission"' /tmp/control-plane-index.html || \
           grep -q 'Actions 可调度' /tmp/control-plane-app.js; then
          echo "ERROR: Actions 能力不应在构建历史区重复展示" >&2
          exit 1
        fi
        python3 - <<'PY'
        from pathlib import Path
        html = Path("/tmp/control-plane-index.html").read_text()
        if html.count("<main") != 1 or html.count("</main>") != 1:
            raise SystemExit("ERROR: Control Plane 页面必须且只能包含一组 main 标签")
        start = html.index('id="build-card"')
        end = html.index('</section>', start)
        block = html[start:end]
        if 'id="trigger-build"' in block or 'id="publish-release"' in block:
            raise SystemExit("ERROR: 完整构建历史区不能包含构建入口或 Release 开关")
        dialog = html[html.index('id="build-dialog"'):]
        if 'id="trigger-build"' not in dialog or 'id="publish-release"' not in dialog:
            raise SystemExit("ERROR: 构建入口与 Release 开关必须位于构建确认弹层")
        app = Path("/tmp/control-plane-app.js").read_text()
        if "artifact.url" in app:
            raise SystemExit("ERROR: Artifact 下载不能退回未承诺的 GitHub Web 页面路径")
        PY

    - name: 构建并启动自托管容器
      run: |
        set -Eeuo pipefail

        image="openwrt-ng-control-plane:self-hosted-test"
        name="openwrt-ng-control-plane-self-hosted-test"

        docker build -f control-plane/Dockerfile -t "$image" .

        cleanup() {
          docker logs "$name" >/tmp/control-plane-container.log 2>&1 || true
          docker rm -f "$name" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        docker run -d \
          --name "$name" \
          -p 127.0.0.1:18787:8787 \
          -e CONTROL_PLANE_ORIGIN=http://127.0.0.1:8787 \
          -e CONTROL_PLANE_ALLOW_INSECURE_LOCALHOST=true \
          -e GITHUB_APP_CLIENT_ID=Iv1.container-test \
          -e GITHUB_APP_CLIENT_SECRET=container-test-client-secret \
          -e GITHUB_APP_SLUG=openwrt-ng-container-test \
          -e TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
          "$image"

        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:18787/api/v1/health >/tmp/container-health.json 2>/dev/null; then
            break
          fi
          if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -qx true; then
            docker logs "$name" >&2 || true
            echo "ERROR: 自托管 Control Plane 容器启动失败" >&2
            exit 1
          fi
          sleep 1
        done

        jq -e '
          .ok == true and
          .runtime == "self-hosted-node" and
          .configured == true
        ' /tmp/container-health.json >/dev/null

        echo "自托管容器启动与 /api/v1/health 验证通过"
