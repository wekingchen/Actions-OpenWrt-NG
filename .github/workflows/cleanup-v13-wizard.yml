name: V1.3 Profile Wizard Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-v13-wizard.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - name: 清理 Profile Wizard 测试分支与 Runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        branch_ref="heads/feature/profile-wizard"
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/$branch_ref" >/dev/null 2>&1; then
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/$branch_ref" \
            --silent
          echo "已删除测试分支 feature/profile-wizard"
        else
          echo "测试分支已不存在"
        fi

        for run_id in \
          36979272171 \
          36979363454 \
          36979436845 \
          36979635445 \
          36979800828
        do
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            --silent || true
        done

        echo "V1.3 Profile Wizard 测试记录清理完成"
