name: Audit Generate Control Plane Lockfile

on:
  push:
    branches:
      - audit/full-project-review
    paths:
      - ".github/workflows/audit-generate-lock.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出审计分支
        uses: actions/checkout@v7
        with:
          ref: audit/full-project-review

      - name: 准备 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 生成并校验 package-lock
        working-directory: control-plane
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test -f package-lock.json

      - name: 提交 lockfile 并自清理
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-plane/package-lock.json
          git rm ".github/workflows/audit-generate-lock.yml"
          git commit -m "chore: pin Control Plane npm dependency graph"
          git push origin HEAD:audit/full-project-review
