name: Cleanup temporary branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-temp-deploy-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 删除临时分支
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: "ops/deploy-control-plane-0160"
        run: |
          set -Eeuo pipefail
          echo "删除临时分支: ${TARGET_BRANCH}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TARGET_BRANCH}"

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 清理临时 Workflow
        env:
          WORKFLOW_FILE: ".github/workflows/cleanup-temp-deploy-branch.yml"
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "${WORKFLOW_FILE}"
          git commit -m "chore: cleanup temporary branch workflow"
          git push origin HEAD:main
