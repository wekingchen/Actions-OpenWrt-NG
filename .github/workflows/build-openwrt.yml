name: OpenWrt NG Builder

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile 目录名（profiles/<name>）"
        required: true
        default: "default"
        type: string
      publish_release:
        description: "是否允许发布 Release（仍受 Profile UPLOAD_RELEASE 控制）"
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [source-code-update]

permissions:
  contents: read

concurrency:
  group: openwrt-ng-${{ github.event.inputs.profile || github.event.client_payload.profile || 'default' }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

jobs:
  preflight:
    name: 构建前快速预检
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.profile.outputs.profile }}

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 解析并校验 Profile
      id: profile
      env:
        REQUESTED_PROFILE: ${{ github.event.inputs.profile || github.event.client_payload.profile || 'default' }}
      run: |
        set -Eeuo pipefail
        chmod +x scripts/*.sh adapters/*.sh
        scripts/profile.sh validate "$REQUESTED_PROFILE"
        printf 'profile=%s\n' "$REQUESTED_PROFILE" >> "$GITHUB_OUTPUT"

    - name: 静态预检
      run: |
        set -Eeuo pipefail

        mapfile -t shell_files < <(
          find adapters scripts profiles -type f -name '*.sh' -print | sort
        )

        for file in "${shell_files[@]}"; do
          bash -n "$file"
        done

        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck -S error "${shell_files[@]}"
        fi

        git diff --check
        echo "静态预检通过"

  build:
    name: 编译 OpenWrt 固件
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.release-assets.outputs.status }}

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 释放 Runner 空间
      run: |
        set -Eeuo pipefail
        echo "清理前："
        df -hT
        sudo rm -rf           /usr/share/dotnet           /usr/local/lib/android           /opt/ghc           /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        echo "清理后："
        df -hT

    - name: 安装通用编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -Eeuo pipefail
        sudo apt-get -qq update
        sudo apt-get -qq install -y           build-essential clang flex bison g++ gawk gcc-multilib gettext           git libncurses-dev libssl-dev python3 python3-setuptools rsync swig           unzip zlib1g-dev file wget curl ccache cmake ninja-build           device-tree-compiler libelf-dev libfuse-dev libglib2.0-dev           libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev           libtool pkgconf qemu-utils squashfs-tools subversion texinfo xxd
        sudo apt-get -qq clean

    - name: 加载 Profile
      env:
        PROFILE_ID_INPUT: ${{ needs.preflight.outputs.profile }}
        PUBLISH_RELEASE_INPUT: ${{ github.event.inputs.publish_release }}
      run: |
        set -Eeuo pipefail
        chmod +x scripts/*.sh adapters/*.sh
        scripts/profile.sh export "$PROFILE_ID_INPUT"

        if [ -n "$PUBLISH_RELEASE_INPUT" ] && [ "$PUBLISH_RELEASE_INPUT" != "true" ]; then
          echo "UPLOAD_RELEASE=false" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

    - name: Adapter 额外依赖
      run: |
        set -Eeuo pipefail
        "$ADAPTER_SCRIPT" install-deps

    - name: 准备 OpenWrt 源码
      run: |
        set -Eeuo pipefail
        "$ADAPTER_SCRIPT" prepare
        [ -d "$GITHUB_WORKSPACE/openwrt" ] || {
          echo "ERROR: Adapter 未生成 openwrt build root" >&2
          exit 1
        }

    - name: 运行 DIY Part 1
      run: |
        set -Eeuo pipefail
        if [ -n "$DIY_PART1" ]; then
          (
            cd openwrt
            bash "$DIY_PART1"
          )
        fi

    - name: 更新 Feeds
      run: |
        set -Eeuo pipefail
        cd openwrt
        ./scripts/feeds update -a

    - name: 计算 Feeds 指纹
      id: feeds
      run: |
        set -Eeuo pipefail
        scripts/trace-feeds.sh           "$GITHUB_WORKSPACE/openwrt"           "$RUNNER_TEMP/openwrt-ng-feed-commits.txt"

        feed_hash="$(sha256sum "$RUNNER_TEMP/openwrt-ng-feed-commits.txt" | awk '{print $1}')"
        echo "hash=$feed_hash" >> "$GITHUB_OUTPUT"
        echo "FEED_FINGERPRINT=$feed_hash" >> "$GITHUB_ENV"
        echo "FEED_COMMITS_FILE=$RUNNER_TEMP/openwrt-ng-feed-commits.txt" >> "$GITHUB_ENV"

    - name: 恢复源码下载缓存
      id: dl-cache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/dl
        key: openwrt-ng-dl-${{ runner.os }}-${{ env.PROFILE_ID }}-${{ steps.feeds.outputs.hash }}
        restore-keys: |
          openwrt-ng-dl-${{ runner.os }}-${{ env.PROFILE_ID }}-

    - name: 安装 Feeds
      run: |
        set -Eeuo pipefail
        cd openwrt
        ./scripts/feeds install -a

    - name: 加载配置并运行 DIY Part 2
      run: |
        set -Eeuo pipefail

        cp "$CONFIG_FILE" "$RUNNER_TEMP/openwrt-ng-repository.config"
        cp "$CONFIG_FILE" openwrt/.config

        if [ -n "$FILES_DIR" ] && [ -d "$FILES_DIR" ]; then
          rm -rf openwrt/files
          cp -a "$FILES_DIR" openwrt/files
        fi

        if [ -n "$DIY_PART2" ]; then
          (
            cd openwrt
            bash "$DIY_PART2"
          )
        fi

        (
          cd openwrt
          make defconfig
        )

    - name: 计算编译缓存指纹
      id: build-cache
      run: |
        set -Eeuo pipefail
        {
          sha256sum openwrt/.config
          printf 'source=%s\n' "$SOURCE_COMMIT"
          printf 'feeds=%s\n' "$FEED_FINGERPRINT"
          [ -z "$DIY_PART1" ] || sha256sum "$DIY_PART1"
          [ -z "$DIY_PART2" ] || sha256sum "$DIY_PART2"
        } | sha256sum | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"

        build_hash="$(tail -n1 "$GITHUB_OUTPUT" | cut -d= -f2-)"
        echo "BUILD_CACHE_FINGERPRINT=$build_hash" >> "$GITHUB_ENV"
        echo "编译缓存指纹：$build_hash"

    - name: 恢复编译缓存
      id: build-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          openwrt/staging_dir/host/ccache
          openwrt/staging_dir/target-*/ccache
          openwrt/.cache/go-build
          ~/.ccache
        key: openwrt-ng-build-${{ runner.os }}-${{ env.PROFILE_ID }}-${{ steps.build-cache.outputs.hash }}
        restore-keys: |
          openwrt-ng-build-${{ runner.os }}-${{ env.PROFILE_ID }}-

    - name: 下载软件包源码
      run: |
        set -Eeuo pipefail
        cd openwrt
        make download -j8
        find dl -type f -size -1024c -print -delete || true

    - name: 保存源码下载缓存
      if: steps.dl-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: openwrt/dl
        key: openwrt-ng-dl-${{ runner.os }}-${{ env.PROFILE_ID }}-${{ steps.feeds.outputs.hash }}

    - name: 编译固件
      id: compile
      env:
        BUILD_STARTED_AT: ${{ github.event.repository.updated_at && '' }}
      run: |
        set -Eeuo pipefail
        export BUILD_STARTED_AT="$(date +%s)"
        scripts/compile.sh           "$GITHUB_WORKSPACE/openwrt"           "$GITHUB_WORKSPACE/build.log"           "$GITHUB_WORKSPACE/build-failure.log"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 保存编译缓存
      if: steps.compile.outputs.status == 'success' && steps.build-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          openwrt/staging_dir/host/ccache
          openwrt/staging_dir/target-*/ccache
          openwrt/.cache/go-build
          ~/.ccache
        key: openwrt-ng-build-${{ runner.os }}-${{ env.PROFILE_ID }}-${{ steps.build-cache.outputs.hash }}

    - name: 校验固件 Manifest
      id: manifest
      run: |
        set -Eeuo pipefail
        manifest_record="$RUNNER_TEMP/openwrt-ng-manifests.txt"
        scripts/validate-manifest.sh           "$GITHUB_WORKSPACE/openwrt"           "$REQUIRED_PACKAGES_FILE"           "$manifest_record"
        echo "MANIFEST_RECORD_FILE=$manifest_record" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 生成最终配置留档
      id: config-record
      run: |
        set -Eeuo pipefail
        scripts/archive-config.sh           "$RUNNER_TEMP/openwrt-ng-repository.config"           "$GITHUB_WORKSPACE/openwrt/.config"           "$GITHUB_WORKSPACE/openwrt"           "$GITHUB_WORKSPACE/config-record"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传最终配置留档
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_config_record_${{ env.PROFILE_ID }}_${{ env.FILE_DATE }}
        path: config-record
        if-no-files-found: error
        retention-days: 30

    - name: 上传编译失败诊断
      if: failure() && !cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_failure_${{ env.PROFILE_ID }}_${{ github.run_id }}
        path: |
          build.log
          build-failure.log
        if-no-files-found: ignore
        retention-days: 7

    - name: 上传完整 bin 目录
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_bin_${{ env.PROFILE_ID }}_${{ env.FILE_DATE }}
        path: openwrt/bin
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: 上传固件目录
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_firmware_${{ env.PROFILE_ID }}_${{ env.FILE_DATE }}
        path: openwrt/bin/targets
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: 准备 Release 附件
      id: release-assets
      if: >-
        steps.compile.outputs.status == 'success' &&
        steps.manifest.outputs.status == 'success' &&
        steps.config-record.outputs.status == 'success' &&
        env.UPLOAD_RELEASE == 'true'
      run: |
        set -Eeuo pipefail
        scripts/prepare-release.sh           "$GITHUB_WORKSPACE/openwrt"           "$GITHUB_WORKSPACE/config-record"           "$GITHUB_WORKSPACE/release-bundle"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传 Release 交接包
      if: steps.release-assets.outputs.status == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_NG_release_bundle_${{ github.run_id }}
        path: release-bundle
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  release:
    name: 发布 OpenWrt 固件
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.release_ready == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write

    steps:
    - name: 下载 Release 交接包
      uses: actions/download-artifact@v8
      with:
        name: OpenWrt_NG_release_bundle_${{ github.run_id }}
        path: release-bundle

    - name: 校验 Release 交接包
      run: |
        set -Eeuo pipefail
        [ -s release-bundle/release.txt ] || {
          echo "ERROR: release.txt 缺失" >&2
          exit 1
        }
        mapfile -t assets < <(find release-bundle/assets -maxdepth 1 -type f -print | sort)
        [ "${#assets[@]}" -gt 0 ] || {
          echo "ERROR: Release 没有附件" >&2
          exit 1
        }
        find release-bundle/assets -maxdepth 1 -type f -printf '  - %f\n' | sort

    - name: 发布固件到 Release
      id: release-upload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        release_tag="$(date +'%Y.%m.%d-%H%M')-${GITHUB_RUN_NUMBER}"
        mapfile -t assets < <(find release-bundle/assets -maxdepth 1 -type f -print | sort)

        gh release create "$release_tag" "${assets[@]}"           --repo "$GITHUB_REPOSITORY"           --target "$GITHUB_SHA"           --title "$release_tag"           --notes-file release-bundle/release.txt

        echo "发布完成：$release_tag"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 清理旧 Releases
      if: steps.release-upload.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        mapfile -t releases < <(
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100"             --jq '.[] | [.created_at, .id, .tag_name] | @tsv' |
          sort -r
        )

        index=0
        for row in "${releases[@]}"; do
          index=$((index + 1))
          [ "$index" -le 10 ] && continue

          release_id="$(printf '%s\n' "$row" | cut -f2)"
          tag_name="$(printf '%s\n' "$row" | cut -f3-)"

          echo "删除旧 Release：$tag_name"
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/releases/$release_id"             --silent
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag_name"             --silent || true
        done

  cleanup:
    name: 清理旧 Workflow 运行记录
    needs: [build, release]
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
    - name: 清理旧 Workflow 运行记录
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        cutoff_epoch="$(date -u -d '30 days ago' +%s)"

        gh api --paginate           "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100"           --jq '.workflows[].id' |
        while read -r workflow_id; do
          [ -n "$workflow_id" ] || continue

          mapfile -t runs < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow_id/runs?per_page=100"               --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            [ "$created_epoch" -lt "$cutoff_epoch" ] || continue

            echo "删除 Workflow run：$run_id（$created_at）"
            gh api -X DELETE               "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id"               --silent
          done
        done
