name: Control Plane Profile Post-Merge Cleanup
run-name: Profile cleanup · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: openwrt-ng-profile-post-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: 清理 Profile 合并后的临时状态
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'openwrt-ng/profile-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
    - name: 检出默认分支
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false

    - name: 共享代码同步门禁
      env:
        OPENWRT_NG_UPSTREAM_REPOSITORY: ${{ vars.OPENWRT_NG_SYNC_GATE_UPSTREAM }}
        OPENWRT_NG_UPSTREAM_REF: ${{ vars.OPENWRT_NG_SYNC_GATE_REF }}
      run: |
        set -Eeuo pipefail
        python3 scripts/verify-shared-sync.py
    - name: 补偿清理 Control Plane Profile 生命周期
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        python3 scripts/profile-post-merge-cleanup.py \
          --event "$GITHUB_EVENT_PATH" \
          --repository "$GITHUB_REPOSITORY"
