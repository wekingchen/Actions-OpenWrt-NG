name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-branch-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: 删除已合并临时分支并自清理
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: "feat/v2-0b-profile-pr"
      WORKFLOW_PATH: ".github/workflows/cleanup-branch-once.yml"
    steps:
      - name: 删除目标临时分支
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "ERROR: 拒绝删除 main" >&2
            exit 1
          fi

          echo "准备删除分支：$TARGET_BRANCH"
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$TARGET_BRANCH"

          echo "分支已删除：$TARGET_BRANCH"

      - name: 删除本次临时 Workflow
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=main" \
              --jq '.sha'
          )"

          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            -f message="chore: remove temporary branch cleanup workflow" \
            -f sha="$sha" \
            -f branch="main"

          echo "临时 Workflow 已自删除。"
