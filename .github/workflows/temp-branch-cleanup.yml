name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: 清理临时开发分支
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7

    - name: 删除本轮临时分支
      shell: bash
      run: |
        set -Eeuo pipefail

        branches=(
          "guard/test-repo-sync"
          "sync/full-main-0216"
          "sync/shared-code-guard"
        )

        for branch in "${branches[@]}"; do
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "删除临时分支：$branch"
            git push origin --delete "$branch"
          else
            echo "跳过不存在的分支：$branch"
          fi
        done
