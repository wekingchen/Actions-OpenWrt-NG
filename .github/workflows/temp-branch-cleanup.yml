name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 清理临时分支
        shell: bash
        run: |
          set -Eeuo pipefail
          for branch in "feature/profile-merge-policy" "sync/control-plane-0219"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
