name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 清理本轮临时分支
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            "fix/profile-restore-optional-files"
            "fix/sync-gate-config-marker"
            "security/template-runtime-isolation"
            "sync/control-plane-0218"
            "sync/p0-runtime-isolation"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
