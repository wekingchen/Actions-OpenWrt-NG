name: Temporary Final Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-final-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 清理最终审计临时分支
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            "chore/final-audit-cleanup"
            "fix/framework-version-contract"
            "sync/control-plane-02111-final-audit"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "删除临时分支：$branch"
              git push origin --delete "$branch"
            else
              echo "跳过不存在分支：$branch"
            fi
          done
