name: Cleanup Ubuntu 24 cache fix branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-ubuntu24-cache-fix-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 删除已合并修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api -X DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/ubuntu24-build-cache-abi"             --silent || true

      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 删除一次性 Workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/cleanup-ubuntu24-cache-fix-once.yml"
          git commit -m "chore: remove Ubuntu 24 cache cleanup helper"
          git push origin HEAD:main
