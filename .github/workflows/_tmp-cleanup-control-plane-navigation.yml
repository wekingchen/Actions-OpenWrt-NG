name: Temporary cleanup Control Plane navigation branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-cleanup-control-plane-navigation.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 删除已合并的导航修复分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/control-plane-real-navigation"
          status="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"
          if [ "${status}" = "204" ]; then
            echo "已删除 fix/control-plane-real-navigation"
          elif [ "${status}" = "422" ] || [ "${status}" = "404" ]; then
            echo "分支已经不存在，无需重复清理"
          else
            cat /tmp/delete-ref.json >&2 || true
            echo "删除分支失败，HTTP ${status}" >&2
            exit 1
          fi
