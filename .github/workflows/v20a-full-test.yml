name: V2.0A Full Test

on:
  push:
    branches:
      - v2/control-plane-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: V2.0A 全量回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 准备 Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: V2 前端与 V1.3 回归
      run: |
        set -Eeuo pipefail
        node --check dashboard/assets/control-plane.js
        node --check dashboard/assets/connect.js
        node scripts/dashboard/test-control-plane.mjs
        bash scripts/dashboard/test-wizard.sh

    - name: Auth Broker 回归
      run: |
        set -Eeuo pipefail
        cd control-plane
        npm test

    - name: Docker 构建
      run: |
        set -Eeuo pipefail
        docker build -f control-plane/Dockerfile -t openwrt-ng-control-plane:test .

    - name: 仓库一致性
      run: |
        set -Eeuo pipefail
        python3 -m json.tool dashboard/data/control-plane.json >/dev/null
        python3 -m json.tool control-plane/api-schema.json >/dev/null
        git diff --check
