name: Temporary Audit Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-audit-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 清理已合并/已放弃分支
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            "audit/feed-package-priority"
            "audit/runtime-api-contract"
            "feature/feed-priority-mode"
            "perf/cache-governance"
            "sync/cache-governance"
            "sync/control-plane-02110-feed-priority"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "删除 $branch"
              git push origin --delete "$branch"
            fi
          done
