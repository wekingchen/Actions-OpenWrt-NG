<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWrt NG Control Plane</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">OpenWrt NG · V2.0B</p>
        <h1>Control Plane</h1>
        <p class="muted">GitHub 登录、Profile 在线编辑，以及通过新分支 + Pull Request 安全保存。</p>
      </div>
      <div id="user-box"></div>
    </header>

    <section class="card" id="login-card">
      <h2>连接 GitHub</h2>
      <p class="muted">授权信息只由 Control Plane 保存；浏览器不会获得 GitHub access token。</p>
      <p class="muted" id="setup-status">正在检查 GitHub App 配置…</p>
      <a class="button" id="login-action" href="/api/v1/auth/start?return_to=/" hidden>使用 GitHub 登录</a>
    </section>

    <section class="card" id="repo-card" hidden>
      <div class="heading">
        <div>
          <p class="eyebrow">Repositories</p>
          <h2>已授权仓库</h2>
        </div>
        <div class="header-actions">
          <a class="button secondary" id="install-app" href="#" hidden>安装/调整 GitHub App</a>
          <button class="button secondary" id="logout" type="button">退出登录</button>
        </div>
      </div>
      <div id="repositories" class="repo-list"></div>
    </section>

    <section class="card" id="profile-card" hidden>
      <p class="eyebrow">Profiles</p>
      <h2 id="profile-title">Profiles</h2>
      <div id="profiles" class="profile-list"></div>
    </section>

    <section class="card" id="editor-card" hidden>
      <div class="heading">
        <div>
          <p class="eyebrow">Profile Editor</p>
          <h2 id="editor-title">编辑 Profile</h2>
          <p class="muted" id="editor-meta"></p>
        </div>
        <span class="permission-pill" id="write-permission"></span>
      </div>

      <label class="field-label" for="file-select">文件</label>
      <select id="file-select" class="file-select"></select>

      <label class="field-label" for="editor-content">内容</label>
      <textarea id="editor-content" class="editor" spellcheck="false"></textarea>

      <div class="editor-actions">
        <button class="button secondary" id="preview-change" type="button">预览变更</button>
        <button class="button" id="create-pr" type="button" disabled>创建分支并发起 PR</button>
      </div>

      <div id="preview-card" class="preview-box" hidden>
        <h3>变更预览</h3>
        <pre id="diff-preview"></pre>
      </div>
      <p class="success" id="write-result" hidden></p>
    </section>

    <p class="error" id="error" hidden></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
